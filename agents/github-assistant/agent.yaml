apiVersion: agentcore.example/v1alpha1
kind: Agent

metadata:
  name: github-assistant
  description: A concise terminal assistant with bounded read-only GitHub tools.
  tags:
    Project: agentcore-yaml-lab

spec:
  engine:
    type: harness

  model:
    provider: bedrock
    id: us.amazon.nova-2-lite-v1:0
    apiFormat: converse_stream
    temperature: 0.2
    topP: 0.9

  instructions:
    system:
      file: prompts/system.md

  limits:
    maxIterations: 8
    maxTokens: 2048
    timeoutSeconds: 120
