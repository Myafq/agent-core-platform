apiVersion: agentcore.example/v1alpha1
kind: Agent

metadata:
  name: github-assistant
  description: A concise terminal assistant with bounded autonomous GitHub tools.
  tags:
    Project: agentcore-yaml-lab

spec:
  engine:
    type: harness

  model:
    provider: bedrock
    id: global.anthropic.claude-sonnet-4-6
    apiFormat: converse_stream
    temperature: 0.2

  instructions:
    system:
      file: prompts/system.md

  interfaces:
    slack:
      name: GitHub Assistant

  limits:
    maxIterations: 8
    maxTokens: 2048
    timeoutSeconds: 120
